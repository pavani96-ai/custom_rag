<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
  <title>RAG application architecture: ingest path, query path, and evaluation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #0f172a; }
      .lane { font-size: 15px; font-weight: bold; fill: #334155; }
      .name { font-size: 15px; font-weight: bold; fill: #0f172a; }
      .tech { font-size: 12px; fill: #475569; }
      .step { font-size: 12px; font-style: italic; fill: #334155; }
      .note { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="title">How a document becomes searchable, and how a question gets an answer</text>

  <!-- Lane backgrounds -->
  <rect x="20" y="60" width="1160" height="200" rx="12" fill="#eef6ff"/>
  <rect x="20" y="280" width="1160" height="200" rx="12" fill="#f0fdf4"/>
  <rect x="20" y="500" width="1160" height="200" rx="12" fill="#fff7ed"/>
  <text x="36" y="84" class="lane">1  INGEST (upload → index)</text>
  <text x="36" y="304" class="lane">2  QUERY (question → cited answer)</text>
  <text x="36" y="524" class="lane">3  EVALUATE (offline quality check)</text>

  <!-- Helper: box with name, tech, step -->
  <!-- Row 1 boxes: y=110 -->
  <g>
    <rect x="50" y="110" width="170" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="135" y="138" text-anchor="middle" class="name">Client</text>
    <text x="135" y="158" text-anchor="middle" class="tech">Browser or curl</text>
    <text x="135" y="178" text-anchor="middle" class="step">POST /uploads</text>
    <text x="135" y="196" text-anchor="middle" class="step">POST /documents/ingest</text>
  </g>
  <g>
    <rect x="260" y="110" width="170" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="345" y="138" text-anchor="middle" class="name">FastAPI</text>
    <text x="345" y="158" text-anchor="middle" class="tech">src/app/api/routes.py</text>
    <text x="345" y="178" text-anchor="middle" class="step">Validate, store, queue</text>
    <text x="345" y="196" text-anchor="middle" class="step">Write job + outbox row</text>
  </g>
  <g>
    <rect x="470" y="110" width="170" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="555" y="138" text-anchor="middle" class="name">Redis</text>
    <text x="555" y="158" text-anchor="middle" class="tech">Celery broker</text>
    <text x="555" y="178" text-anchor="middle" class="step">Delivers index job</text>
  </g>
  <g>
    <rect x="680" y="110" width="170" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="765" y="138" text-anchor="middle" class="name">Celery worker</text>
    <text x="765" y="158" text-anchor="middle" class="tech">src/app/rag/indexing.py</text>
    <text x="765" y="178" text-anchor="middle" class="step">pypdf, SentenceSplitter</text>
    <text x="765" y="196" text-anchor="middle" class="step">Chunk IDs from text hash</text>
  </g>
  <g>
    <rect x="890" y="110" width="250" height="110" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text x="1015" y="134" text-anchor="middle" class="name">Jina embeddings</text>
    <text x="1015" y="154" text-anchor="middle" class="tech">jina-embeddings-v5-text-small, 512-dim</text>
    <text x="1015" y="176" text-anchor="middle" class="step">Embed each chunk (batched)</text>
    <text x="1015" y="196" text-anchor="middle" class="step">Then bulk write to OpenSearch</text>
  </g>

  <!-- Row 1 arrows -->
  <line x1="220" y1="165" x2="258" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="165" x2="468" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="165" x2="678" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="165" x2="888" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 1 storage line -->
  <text x="36" y="245" class="note">Stores: Postgres holds collections, documents, jobs (status: queued, processing, ready, failed). Local folder data/storage holds originals. OpenSearch holds chunk text, vectors, and keyword index.</text>
  <rect x="50" y="252" width="1080" height="1" fill="#bfdbfe"/>

  <!-- Row 2 boxes: y=330 -->
  <g>
    <rect x="50" y="330" width="170" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="135" y="358" text-anchor="middle" class="name">Question</text>
    <text x="135" y="378" text-anchor="middle" class="tech">POST /collections/{id}/ask</text>
    <text x="135" y="398" text-anchor="middle" class="step">Only ready documents</text>
  </g>
  <g>
    <rect x="260" y="330" width="170" height="110" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text x="345" y="358" text-anchor="middle" class="name">Jina embedding</text>
    <text x="345" y="378" text-anchor="middle" class="tech">Embeds the question</text>
    <text x="345" y="398" text-anchor="middle" class="step">Same model as ingest</text>
  </g>
  <g>
    <rect x="470" y="330" width="210" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="575" y="358" text-anchor="middle" class="name">OpenSearch hybrid</text>
    <text x="575" y="378" text-anchor="middle" class="tech">kNN vector (weight 0.6)</text>
    <text x="575" y="398" text-anchor="middle" class="tech">BM25 keyword (weight 0.4)</text>
    <text x="575" y="418" text-anchor="middle" class="step">Top 20 candidates, fused</text>
  </g>
  <g>
    <rect x="710" y="330" width="190" height="110" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text x="805" y="358" text-anchor="middle" class="name">Jina reranker</text>
    <text x="805" y="378" text-anchor="middle" class="tech">jina reranker</text>
    <text x="805" y="398" text-anchor="middle" class="step">Keeps the best 5 passages</text>
  </g>
  <g>
    <rect x="930" y="330" width="210" height="110" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="1035" y="358" text-anchor="middle" class="name">Gemini (GEMINI_MODEL)</text>
    <text x="1035" y="378" text-anchor="middle" class="tech">Answers using only passages</text>
    <text x="1035" y="398" text-anchor="middle" class="step">Returns cited source_ids</text>
  </g>

  <line x1="220" y1="385" x2="258" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="385" x2="468" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="385" x2="708" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="385" x2="928" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="36" y="465" class="note">Answer returned: the answer text, plus only the sources it cited (citation numbers map to document, page, and text). No match means "insufficient evidence", with no LLM call.</text>
  <rect x="50" y="472" width="1080" height="1" fill="#fed7aa"/>

  <!-- Row 3 boxes: y=550 -->
  <g>
    <rect x="50" y="550" width="230" height="110" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="165" y="578" text-anchor="middle" class="name">Dataset generation</text>
    <text x="165" y="598" text-anchor="middle" class="tech">LlamaIndex + GEMINI_MODEL</text>
    <text x="165" y="618" text-anchor="middle" class="step">Questions from the PDF pages</text>
  </g>
  <g>
    <rect x="320" y="550" width="230" height="110" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="435" y="578" text-anchor="middle" class="name">Score run</text>
    <text x="435" y="598" text-anchor="middle" class="tech">Calls the running API /ask</text>
    <text x="435" y="618" text-anchor="middle" class="step">Records answers and passages</text>
  </g>
  <g>
    <rect x="590" y="550" width="260" height="110" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="720" y="578" text-anchor="middle" class="name">Ragas metrics</text>
    <text x="720" y="598" text-anchor="middle" class="tech">Judge: GEMINI_JUDGE_MODEL</text>
    <text x="720" y="618" text-anchor="middle" class="step">Faithfulness, relevancy, recall, precision</text>
  </g>
  <g>
    <rect x="890" y="550" width="250" height="110" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="1015" y="578" text-anchor="middle" class="name">Report JSON</text>
    <text x="1015" y="598" text-anchor="middle" class="tech">evals/ folder</text>
    <text x="1015" y="618" text-anchor="middle" class="step">Averages and per-question scores</text>
  </g>
  <line x1="280" y1="605" x2="318" y2="605" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="605" x2="588" y2="605" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="605" x2="888" y2="605" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="36" y="690" class="note">Two models: GEMINI_MODEL answers questions in the API. GEMINI_JUDGE_MODEL grades evals. Keep them different. Both come from .env.</text>
  <text x="36" y="714" class="note">Local stack (Docker Compose): postgres, redis, opensearch, api, worker, flower (127.0.0.1:5555). Eval runs in its own container.</text>
</svg>
